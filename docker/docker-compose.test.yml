version: "3.9"

# Ephemeral test stack — completely isolated from prod
# Usage: podman compose -f docker/docker-compose.test.yml up -d --build
#        podman compose -f docker/docker-compose.test.yml run --rm test-runner pytest tests/e2e -v --base-url=http://app-test:8081

services:
  app-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: camera-event-manager-test
    ports:
      - "8181:8080"
      # WebRTC — required for live view; without this, the browser cannot receive media.
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - test_recordings:/mnt/recordings
      - test_data:/opt/camera-event-manager/data
      - e2e_recordings:/tmp/e2e-recordings
    environment:
      DATABASE_URL: sqlite:////opt/camera-event-manager/data/cam.db
      RECORDING_LOCATIONS: /mnt/recordings
      THUMBNAIL_DIR: /opt/camera-event-manager/data/thumbnails
      SCAN_INTERVAL_MINUTES: 60
      LOG_LEVEL: DEBUG
      # go2rtc advertises this address to browsers for WebRTC peer connections.
      # Without it, live view silently fails (go2rtc runs but the browser can't connect).
      GO2RTC_WEBRTC_CANDIDATE: ${GO2RTC_WEBRTC_CANDIDATE:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  smoke-test:
    image: python:3.14-slim
    container_name: camera-event-manager-smoke-test
    depends_on:
      app-test:
        condition: service_healthy
    entrypoint: ["bash", "/app/scripts/smoke-test.sh"]
    command: ["http://app-test:8080"]
    volumes:
      - ../scripts:/app/scripts:ro

  test-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: camera-event-manager-test-runner
    depends_on:
      app-test:
        condition: service_healthy
      smoke-test:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      RECORDING_LOCATIONS: /tmp/test_recordings
      THUMBNAIL_DIR: /tmp/test_thumbnails
      CI: "true"
    volumes:
      - ../tests:/app/tests:ro
      - e2e_recordings:/tmp/cem-e2e-recordings

volumes:
  test_recordings:
  test_data:
  e2e_recordings:
